name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Parse native Windows lifecycle verifier scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @('./scripts/verify-active-signed-candidate-upgrade.ps1','./scripts/verify-cli-version-output.ps1','./scripts/windows-architecture.ps1','./scripts/test-release-resolution.ps1')
          foreach ($file in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }
      - name: Test Windows installer architecture and release resolution
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-release-resolution.ps1
      - name: Test release asset contract and protocol smoke validation
        if: runner.os == 'Linux'
        run: |
          bash scripts/test-release-assets.sh
          bash scripts/test-copy-release-executable.sh
          bash scripts/test-release-provenance.sh
          bash scripts/test-release-version-flow.sh
          python3 scripts/test-protocol-smoke.py
      - name: Test resource measurement harness
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Join-Path $env:RUNNER_TEMP 'komposyn-lg.exe'
          go build -o $binary ./plugins/cli/token-logger
          $env:KOMPOSYN_LG_TEST_BINARY = $binary
          python scripts/test-measure-collector.py
      - name: Test resource measurement harness
        if: runner.os != 'Windows'
        run: python3 scripts/test-measure-collector.py
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Verify modules
        run: go mod verify
      - name: Scan dependencies
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
  race:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Race tests
        run: go test -race ./...

  historical-fixture-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build candidate release
        run: make release VERSION=v0.8.1 OUTPUT_DIR=dist
      - name: Upload candidate archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: historical-fixture-candidate
          path: dist
          if-no-files-found: error

  published-upgrades:
    needs: historical-fixture-artifacts
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_amd64
          - runner: ubuntu-24.04-arm
            target: linux_arm64
          - runner: macos-15-intel
            target: darwin_amd64
          - runner: macos-latest
            target: darwin_arm64
          - runner: windows-latest
            target: windows_amd64
          - runner: windows-11-arm
            target: windows_arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download candidate archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: historical-fixture-candidate
          path: dist
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Cosign
        if: matrix.target != 'windows_arm64'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Install pinned Cosign natively on Windows ARM64
        if: matrix.target == 'windows_arm64'
        run: go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.3
      - name: Verify upgrades from published CLI v0.6.0, v0.7.0 and v0.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-published-upgrades.sh dist "$RUNNER_TEMP/published-upgrades" "${{ matrix.target }}"
