name: Publish release

on:
  workflow_dispatch:
    inputs:
      confirm_standalone_readiness:
        description: Confirm standalone release readiness checks and reviewed release PR are complete
        required: true
        type: boolean
      release_commit:
        description: Optional master commit for a reviewed-release retry after a post-merge fix
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate prepared release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Check out master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: master

      - name: Resolve merged release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT_INPUT: ${{ inputs.release_commit }}
        shell: bash
        run: |
          mapfile -t pending < <(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state merged \
              --label "autorelease: pending" \
              --json number,mergeCommit \
              --jq '.[] | select(.mergeCommit.oid != null) | "\(.number) \(.mergeCommit.oid)"'
          )
          if [[ "${#pending[@]}" -ne 1 ]]; then
            printf 'Expected exactly one merged Release Please PR, found %s:\n' "${#pending[@]}" >&2
            printf '%s\n' "${pending[@]}" >&2
            exit 1
          fi
          prepared_commit="${pending[0]##* }"
          commit="$prepared_commit"
          if [[ -n "$RELEASE_COMMIT_INPUT" ]]; then
            git cat-file -e "$RELEASE_COMMIT_INPUT^{commit}"
            git merge-base --is-ancestor "$prepared_commit" "$RELEASE_COMMIT_INPUT" || {
              echo "Recovery commit must descend from the merged release PR commit $prepared_commit" >&2
              exit 1
            }
            git merge-base --is-ancestor "$RELEASE_COMMIT_INPUT" HEAD || {
              echo "Recovery commit must be reachable from master" >&2
              exit 1
            }
            commit="$RELEASE_COMMIT_INPUT"
            echo "Using reviewed-release recovery commit $commit after $prepared_commit"
          fi
          git cat-file -e "$commit^{commit}"
          git checkout --detach "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Confirm standalone release readiness
        if: inputs.confirm_standalone_readiness != true
        run: |
          echo 'Standalone publication requires verified release readiness before publication' >&2
          exit 1

      - name: Read and validate prepared version
        id: version
        shell: bash
        run: |
          VERSION="$(jq -er '.["."] | select(type == "string")' .release-please-manifest.json)"
          if [[ "$VERSION" == "0.0.0" || ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Prepared release must be a non-zero semantic version" >&2
            exit 1
          fi
          TAG="v$VERSION"
          existing_commit="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" || true)"
          if [[ -n "$existing_commit" && "$existing_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "Tag $TAG exists at $existing_commit, not the tested release commit" >&2
            exit 1
          fi
          version_pattern="${VERSION//./\\.}"
          if ! grep -Eq "^## (\\[$version_pattern\\](\\([^)]*\\))?|$version_pattern)( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md has no release section for $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Record tested commit
        id: commit
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.9
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race tests
        run: go test -race ./...

  build-release:
    name: Build and sign release artifacts
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.9
          cache: true

      - name: Build release artifacts
        run: |
          make release VERSION="${{ needs.prepare.outputs.tag }}" OUTPUT_DIR=dist

      - name: Verify installation, upgrade, and uninstall
        run: bash scripts/verify-release.sh dist

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3

      - name: Sign release artifacts
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          for artifact in dist/komposyn-lg_* dist/SHA256SUMS; do
            cosign sign-blob --yes \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.pem" \
              "$artifact"
            cosign verify-blob \
              --signature "${artifact}.sig" \
              --certificate "${artifact}.pem" \
              --certificate-identity-regexp '^https://github.com/ayeshLK/komposyn-lg/.github/workflows/release.yml@refs/heads/master$' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$artifact"
          done

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: dist
          if-no-files-found: error

  verify-installers:
    name: Verify installer and runtime (${{ matrix.target }})
    needs: [prepare, build-release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux_amd64
          - os: ubuntu-24.04-arm
            target: linux_arm64
          - os: macos-15-intel
            target: darwin_amd64
          - os: macos-latest
            target: darwin_arm64
          - os: windows-latest
            target: windows_amd64
          - os: windows-11-arm
            target: windows_arm64
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Download signed release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dist

      - name: Set up Go for archive metadata inspection
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: 1.26.9

      - name: Install Cosign
        if: matrix.os != 'windows-11-arm'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3

      - name: Set up Go for native Windows ARM64 Cosign build
        if: matrix.os == 'windows-11-arm'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: 1.26.9

      - name: Install pinned Cosign natively on Windows ARM64
        if: matrix.os == 'windows-11-arm'
        run: go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.3

      - name: Verify signed native runtime, metadata, and protocol smoke
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_CORE_VERSION: 0.7.0
        shell: bash
        run: bash scripts/verify-signed-runtime.sh dist "$EXPECTED_TARGET" "$EXPECTED_VERSION" "$EXPECTED_CORE_VERSION"

      - name: Verify Unix installer lifecycle
        if: runner.os != 'Windows'
        env:
          KOMPOSYN_VERSION: ${{ needs.prepare.outputs.tag }}
          KOMPOSYN_RELEASE_DIR: ${{ github.workspace }}/dist
          KOMPOSYN_INSTALL_DIR: ${{ runner.temp }}/komposyn-bin
          TOKEN_LOGGER_DATA_DIR: ${{ runner.temp }}/komposyn-data
        run: |
          bash scripts/install.sh
          "$KOMPOSYN_INSTALL_DIR/komposyn-lg" version
          "$KOMPOSYN_INSTALL_DIR/komposyn-lg" settings --collector off --auto-start off
          "$KOMPOSYN_INSTALL_DIR/komposyn-lg" usage --format json > /dev/null
          mkdir -p "$RUNNER_TEMP/komposyn-source"
          "$KOMPOSYN_INSTALL_DIR/komposyn-lg" watch add "$RUNNER_TEMP/komposyn-source"
          "$KOMPOSYN_INSTALL_DIR/komposyn-lg" watch start --interval 1s
          test -f "$TOKEN_LOGGER_DATA_DIR/settings.json"
          test -f "$TOKEN_LOGGER_DATA_DIR/token-logger.db"
          bash scripts/install.sh
          "$KOMPOSYN_INSTALL_DIR/komposyn-lg" watch status --format json | grep -Eq '"state":"(running|degraded)"'
          test -f "$TOKEN_LOGGER_DATA_DIR/settings.json"
          test -f "$TOKEN_LOGGER_DATA_DIR/token-logger.db"
          bash scripts/uninstall.sh
          test ! -e "$KOMPOSYN_INSTALL_DIR/komposyn-lg"
          test -f "$TOKEN_LOGGER_DATA_DIR/settings.json"
          test -f "$TOKEN_LOGGER_DATA_DIR/token-logger.db"

      - name: Verify release archive lifecycle on native Windows ARM64
        if: matrix.os == 'windows-11-arm'
        shell: bash
        run: bash scripts/verify-release.sh dist "" "${{ matrix.target }}"

      - name: Verify Windows installer lifecycle
        if: runner.os == 'Windows'
        env:
          KOMPOSYN_VERSION: ${{ needs.prepare.outputs.tag }}
          KOMPOSYN_RELEASE_DIR: ${{ github.workspace }}/dist
          EXPECTED_TARGET: ${{ matrix.target }}
        shell: pwsh
        run: |
          $env:KOMPOSYN_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'komposyn-bin'
          $env:TOKEN_LOGGER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'komposyn-data'
          & ./scripts/install.ps1
          $binary = Join-Path $env:KOMPOSYN_INSTALL_DIR 'komposyn-lg.exe'
          & $binary version
          $expectedGoArch = if ($env:EXPECTED_TARGET -eq 'windows_arm64') { 'arm64' } else { 'amd64' }
          $metadata = (& go version -m $binary | Out-String)
          if ($metadata -notmatch 'GOOS=windows' -or $metadata -notmatch "GOARCH=$expectedGoArch") { throw "installer selected the wrong native archive for $env:EXPECTED_TARGET`n$metadata" }
          & $binary settings --collector off --auto-start off
          & $binary usage --format json | Out-Null
          $source = Join-Path $env:RUNNER_TEMP 'komposyn-source'
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          & $binary watch add $source
          & $binary watch start --interval 1s
          if (-not (Test-Path (Join-Path $env:TOKEN_LOGGER_DATA_DIR 'settings.json'))) { throw 'settings were not created' }
          if (-not (Test-Path (Join-Path $env:TOKEN_LOGGER_DATA_DIR 'token-logger.db'))) { throw 'database was not created' }
          & ./scripts/install.ps1
          $collector = (& $binary watch status --format json | ConvertFrom-Json)
          if ($collector.state -notin @('running', 'degraded')) { throw "collector was not restarted after upgrade: $($collector.state)" }
          & ./scripts/uninstall.ps1
          if (Test-Path $binary) { throw 'uninstall left executable behind' }
          if (-not (Test-Path (Join-Path $env:TOKEN_LOGGER_DATA_DIR 'settings.json'))) { throw 'uninstall removed settings' }
          if (-not (Test-Path (Join-Path $env:TOKEN_LOGGER_DATA_DIR 'token-logger.db'))) { throw 'uninstall removed database' }

  verify-signed-artifacts:
    name: Verify all six signed release archives
    needs: [prepare, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download signed release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: dist
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Verify exact standalone workflow identity and all checksums
        shell: bash
        run: |
          identity='^https://github.com/ayeshLK/komposyn-lg/.github/workflows/release.yml@refs/heads/master$'
          issuer='https://token.actions.githubusercontent.com'
          cosign verify-blob --signature dist/SHA256SUMS.sig --certificate dist/SHA256SUMS.pem --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" dist/SHA256SUMS
          mapfile -t archives < <(find dist -maxdepth 1 -type f \( -name 'komposyn-lg_*.tar.gz' -o -name 'komposyn-lg_*.zip' \) -print | sort)
          [[ "${#archives[@]}" -eq 6 ]]
          (cd dist && sha256sum -c SHA256SUMS)
          for archive in "${archives[@]}"; do
            cosign verify-blob --signature "${archive}.sig" --certificate "${archive}.pem" --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "$archive"
          done

  verify-active-historical:
    name: Verify signed cross-version active collector upgrade (${{ matrix.target }})
    needs: [prepare, build-release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux_amd64
          - os: ubuntu-24.04-arm
            target: linux_arm64
          - os: macos-15-intel
            target: darwin_amd64
          - os: macos-latest
            target: darwin_arm64
          - os: windows-latest
            target: windows_amd64
          - os: windows-11-arm
            target: windows_arm64
    steps:
      - name: Check out tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Download signed candidate artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: dist
      - name: Set up Go for Cosign
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: 1.26.9
      - name: Install Cosign
        if: matrix.os != 'windows-11-arm'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Install pinned Cosign natively on Windows ARM64
        if: matrix.os == 'windows-11-arm'
        run: go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.3
      - name: Verify active collector upgrade on native Unix
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-active-signed-candidate-upgrade.sh v0.6.0 dist
      - name: Verify active collector upgrade on native Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: ./scripts/verify-active-signed-candidate-upgrade.ps1 -OldTag v0.6.0 -CandidateDir dist

  publish:
    name: Publish GitHub release
    needs: [prepare, build-release, verify-installers, verify-signed-artifacts, verify-active-historical]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Download signed release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dist

      - name: Create draft release and upload signed assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: |
          mapfile -t assets < <(bash scripts/list-release-assets.sh dist)

          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v version="${RELEASE_TAG#v}" '
            /^## / {
              if (found) exit
              plain="## " version
              linked="## [" version "]"
              if ($0 == plain || index($0, plain " ") == 1 ||
                  $0 == linked || index($0, linked "(") == 1 ||
                  index($0, linked " ") == 1) {
                found=1
                next
              }
            }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          [[ -s "$notes_file" ]] || {
            echo "Reviewed changelog entry for $RELEASE_TAG is empty or missing" >&2
            exit 1
          }

          existing_commit="$(git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" || true)"
          if [[ -n "$existing_commit" && "$existing_commit" != "$RELEASE_COMMIT" ]]; then
            echo "Existing tag $RELEASE_TAG points to $existing_commit, expected $RELEASE_COMMIT" >&2
            exit 1
          fi
          release_exists=false
          if release_json="$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish 2>/dev/null)"; then
            release_exists=true
            [[ "$(jq -r '.isDraft' <<<"$release_json")" == true ]] || {
              echo "Release $RELEASE_TAG already exists and is published" >&2
              exit 1
            }
          fi
          if [[ "$release_exists" == false ]]; then
            if [[ -n "$existing_commit" ]]; then
              gh release create "$RELEASE_TAG" --draft --verify-tag --notes-file "$notes_file"
            else
              gh release create "$RELEASE_TAG" --draft --target "$RELEASE_COMMIT" --notes-file "$notes_file"
            fi
          else
            if [[ -n "$existing_commit" ]]; then
              gh release edit "$RELEASE_TAG" --notes-file "$notes_file"
            else
              gh release edit "$RELEASE_TAG" --target "$RELEASE_COMMIT" --notes-file "$notes_file"
            fi
          fi

          if [[ -z "$existing_commit" ]]; then
            draft_target="$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)"
            [[ "$draft_target" == "$RELEASE_COMMIT" ]] || {
              echo "Draft release $RELEASE_TAG targets $draft_target, expected $RELEASE_COMMIT" >&2
              exit 1
            }
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          expected_assets="$(for asset in "${assets[@]}"; do basename "$asset"; done | sort)"
          actual_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          [[ "$actual_assets" == "$expected_assets" ]] || {
            echo 'Draft release asset set does not exactly match the signed build output' >&2
            diff -u <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$actual_assets") || true
            exit 1
          }
          gh release edit "$RELEASE_TAG" --draft=false

      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          [[ "$is_draft" == false ]] || {
            echo "release was not published" >&2
            exit 1
          }
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tagged_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          [[ "$tagged_commit" == "$RELEASE_COMMIT" ]] || {
            echo "Tag $RELEASE_TAG resolves to $tagged_commit, expected $RELEASE_COMMIT" >&2
            exit 1
          }

      - name: Install Cosign for published asset verification
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3

      - name: Verify downloaded published assets and Linux lifecycle
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          mkdir published
          gh release download "$RELEASE_TAG" --dir published
          mapfile -t assets < <(bash scripts/list-release-assets.sh dist)
          expected_assets="$(printf '%s\n' "${assets[@]}" | xargs -n1 basename | sort)"
          actual_assets="$(find published -maxdepth 1 -type f -printf '%f\n' | sort)"
          [[ "$actual_assets" == "$expected_assets" ]] || {
            echo 'published release asset set differs from the upload allowlist' >&2
            diff -u <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$actual_assets") || true
            exit 1
          }
          for artifact in "${assets[@]}"; do
            published_artifact="published/$(basename "$artifact")"
            [[ -f "$published_artifact" ]] || { echo "published release is missing $(basename "$artifact")" >&2; exit 1; }
            cmp -s "$artifact" "$published_artifact" || { echo "published asset differs from tested signed artifact: $(basename "$artifact")" >&2; exit 1; }
          done
          identity='^https://github.com/ayeshLK/komposyn-lg/.github/workflows/release.yml@refs/heads/master$'
          issuer='https://token.actions.githubusercontent.com'
          cosign verify-blob --signature published/SHA256SUMS.sig --certificate published/SHA256SUMS.pem --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" published/SHA256SUMS
          mapfile -t archives < <(find published -maxdepth 1 -type f \( -name 'komposyn-lg_*.tar.gz' -o -name 'komposyn-lg_*.zip' \) -print | sort)
          [[ "${#archives[@]}" -eq 6 ]]
          (cd published && sha256sum -c SHA256SUMS)
          for archive in "${archives[@]}"; do
            cosign verify-blob --signature "${archive}.sig" --certificate "${archive}.pem" --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "$archive"
          done
          bash scripts/verify-signed-runtime.sh published linux_amd64 "$RELEASE_VERSION" 0.7.0
          bash scripts/verify-release.sh published

      - name: Remove completed release marker
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state merged \
            --label "autorelease: pending" \
            --json number \
            --jq '.[].number' | while read -r number; do
              gh pr edit "$number" --remove-label "autorelease: pending"
            done
